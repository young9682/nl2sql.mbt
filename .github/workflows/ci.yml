name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit toolchain
        # The pinned SQL parser's prettyprinter dependency uses implicit trait methods.
        run: curl -fsSL --retry 3 https://cli.moonbitlang.com/install/unix.sh | bash -s -- '0.10.20+65efd5b93'
      - name: Add moon to PATH
        run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: moon update (refresh registry index)
        run: moon update
      - name: moon fmt --check
        run: moon fmt --check
      - name: Install SQLite development files
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libssl-dev
      - name: moon check (native)
        run: moon check --target native
      - name: moon test (native)
        run: moon test --target native
      - name: Replay M3 development fixtures
        run: moon run --quiet --target native cmd/eval -- --fixture
      - name: Replay M3 museum holdout fixtures
        run: moon run --quiet --target native cmd/eval -- --fixture --holdout
      - name: Run the Native CLI demo without credentials
        run: |
          set -o pipefail
          env -u NL2SQL_ENDPOINT -u NL2SQL_MODEL -u NL2SQL_API_KEY moon run --quiet cmd/nl2sql -- --demo \
            | python3 -c 'import json, sys; report = json.load(sys.stdin); assert report["status"] == "ok"; assert [row[1][1] for row in report["result"]["rows"]] == [50, 20]'
      - name: Verify the independent inventory report module
        run: python3 examples/inventory-report/verify.py
      - name: moon test (Wasm core)
        run: moon test --target wasm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build and verify the credential-free Wasm demo
        run: |
          npm ci --prefix examples/wasm-demo --ignore-scripts
          moon build --target wasm-gc --release examples/wasm-demo
          moon build --target js --release examples/wasm-demo
          env -u NL2SQL_API_KEY -u NL2SQL_ENDPOINT -u NL2SQL_MODEL -u OPENAI_API_KEY \
            node --test examples/wasm-demo/demo.test.mjs
