name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit toolchain
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
      - name: Add moon to PATH
        run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: moon update (refresh registry index)
        run: moon update
      - name: moon fmt --check
        run: moon fmt --check
      - name: moon check
        run: moon check
      - name: moon test
        run: moon test
